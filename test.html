<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API CORS 測試工具</title>
</head>
<body>
    <h1>API CORS 測試工具</h1>
    <p>輸入 JSON API 連結，然後按「測試」</p>

    <input type="text" id="apiUrl" 
           style="width: 100%; padding: 10px; font-size: 16px;"
           placeholder="https://data.weather.gov.hk/..." 
           value="https://www.1823.gov.hk/common/ical/tc.json">

    <br><br>
    <button onclick="testAPI()" style="padding: 10px 20px; font-size: 16px;">測試 API</button>

    <div id="result" style="margin-top: 20px;"></div>

    <script>
        async function testAPI() {
            const url = document.getElementById('apiUrl').value.trim();
            const resultDiv = document.getElementById('result');

            if (!url) {
                resultDiv.innerHTML = '<p style="color:red;">請輸入 API 連結！</p>';
                return;
            }

            resultDiv.innerHTML = '<p>正在請求資料...</p>';

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);
                }

                const data = await response.json();

                resultDiv.innerHTML = `
                    <p style="color:green;">✅ 成功！</p>
                    <p><strong>API：</strong> ${url}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;

            } catch (err) {
                console.error('請求失敗：', err);

                let msg = err.message;

                if (err.message.includes('CORS') || err.message.includes('Access-Control-Allow-Origin')) {
                    msg = '❌ CORS 錯誤：這個 API 不允許從其他網站直接讀取資料。';
                }

                resultDiv.innerHTML = `
                    <p style="color:red;">❌ 請求失敗</p>
                    <p><strong>測試 API：</strong> ${url}</p>
                    <p>${msg}</p>
                `;
            }
        }

        // 按 Enter 鍵都可以測試
        document.getElementById('apiUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') testAPI();
        });

        // 頁面載入後自動測試一次
        window.onload = testAPI;
    </script>
</body>
</html>
