<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>test get data in real time</title>
</head>
<body>
    <h1>香港天文台 JSON</h1>
    <div id="result"></div>

    <script>
        async function fetchData() {
            try {
                // 舉例：公眾假期資料集 API（要換成你搵到嘅真實 API 連結）
                const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/lunardate.php?date=2023');
                
                const data = await response.json();
                document.getElementById('result').innerHTML = JSON.stringify(data, null, 2);
                
                // 或者自己 loop 顯示成表格
            } catch (error) {
                console.error('攞資料出事：', error);
            }
        }

        fetchData();
    </script>
</body>
</html>
