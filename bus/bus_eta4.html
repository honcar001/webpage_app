<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KMB + 城巴 ETA Dashboard</title>
  <style>
    :root{
      --bg:#08111f;
      --card:#101a33;
      --line:#253457;
      --text:#eef4ff;
      --muted:#93a2c7;
      --good:#36d399;
      --accent:#6ea8fe;
      --ctb:#ffb020;
      --kmb:#4f8cff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans HK","PingFang HK","Helvetica Neue",Arial,sans-serif;
      background:radial-gradient(circle at top, #17274b, var(--bg));
      color:var(--text);
    }
    .app{
      max-width:1100px;
      margin:0 auto;
      padding:12px;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      background:rgba(16,26,51,.92);
      border:1px solid var(--line);
      border-radius:18px;
      backdrop-filter:blur(10px);
    }
    .title{font-size:18px;font-weight:800;line-height:1.2}
    .meta{font-size:12px;color:var(--muted);margin-top:4px}
    button{
      appearance:none;
      border:0;
      background:linear-gradient(135deg,#4f8cff,#6ea8fe);
      color:#fff;
      font-weight:800;
      padding:12px 16px;
      border-radius:14px;
      font-size:15px;
      box-shadow:0 8px 20px rgba(78,124,255,.25);
    }
    button:disabled{opacity:.6}
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      flex:1;
      min-height:0;
    }
    .panel{
      background:rgba(16,26,51,.92);
      border:1px solid var(--line);
      border-radius:18px;
      padding:12px;
      display:flex;
      flex-direction:column;
      min-height:0;
    }
    .panel h2{margin:0 0 6px;font-size:18px}
    .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
    .group{
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow:auto;
      min-height:0;
    }
    .stopcard{
      background:rgba(22,33,63,.92);
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px;
    }
    .stopname{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center;
      font-weight:800;
      margin-bottom:8px;
    }
    .small{color:var(--muted);font-size:12px}
    .route{
      display:grid;
      grid-template-columns:56px 1fr;
      gap:8px;
      align-items:center;
      padding:8px 10px;
      border-radius:12px;
      background:#0f172d;
      border:1px solid #223055;
      font-size:14px;
      margin-bottom:6px;
    }
    .badge{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      width:56px;
      padding:5px 0;
      border-radius:999px;
      background:#21315a;
      color:#dce8ff;
      font-weight:800;
    }
    .badge.kmb{background:rgba(79,140,255,.18); color:#9fc0ff}
    .badge.ctb{background:rgba(255,176,32,.18); color:#ffd58b}
    .etas{color:var(--good);font-weight:800}
    .foot{
      color:var(--muted);
      font-size:11px;
      text-align:center;
      padding-bottom:2px;
    }
    @media (max-width:820px){
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div>
        <div class="title">KMB + 城巴 實時 ETA</div>
        <div class="meta" id="status">載入中...</div>
      </div>
      <button id="refreshBtn">Refresh</button>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>返工（往港島）</h2>
        <div class="sub">土瓜灣街市</div>
        <div class="group" id="workList"></div>
      </section>

      <section class="panel">
        <h2>放工（往九龍）</h2>
        <div class="sub">景隆街 · 怡和街</div>
        <div class="group" id="homeList"></div>
      </section>
    </div>

    <div class="foot">KMB: data.etabus.gov.hk｜城巴: rt.data.gov.hk / DATA.GOV.HK</div>
  </div>

<script>
const KMB_API = "https://data.etabus.gov.hk/v1/transport/kmb";
const CTB_API = "https://rt.data.gov.hk/v2/transport/citybus";

const config = {
  work: [
    { company: "KMB", name: "土瓜灣街市", aliases: ["土瓜灣街市", "To Kwa Wan Market"], routes: ["107", "108"] }
  ],
  home: [
    { company: "KMB", name: "景隆街", aliases: ["景隆街", "Cannon Street"], routes: ["106"] },
    { company: "KMB", name: "怡和街", aliases: ["怡和街", "Jardine's Crescent"], routes: ["108", "116"] },

    { company: "CTB", name: "景隆街", aliases: ["景隆街", "Cannon Street"], routes: ["6", "6X", "66"] },
    { company: "CTB", name: "怡和街", aliases: ["怡和街", "Jardine's Crescent"], routes: ["2A", "2X", "8", "10", "5B", "15"] }
  ]
};

let kmbStopsCache = null;
let ctbStopsCache = null;

async function fetchJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function norm(s){
  return String(s || "").trim().toLowerCase();
}

function fmtEta(eta){
  if(!eta) return "—";
  const t = new Date(eta);
  if(isNaN(t)) return eta;
  const diff = Math.round((t - new Date()) / 60000);
  if(diff <= 0) return "到站";
  if(diff === 1) return "1 分鐘";
  return `${diff} 分鐘`;
}

async function loadKmbStops(){
  if (kmbStopsCache) return kmbStopsCache;
  const data = await fetchJSON(`${KMB_API}/stop`);
  kmbStopsCache = data.data || data;
  return kmbStopsCache;
}

async function loadCtbStops(){
  if (ctbStopsCache) return ctbStopsCache;
  const data = await fetchJSON(`${CTB_API}/stop`);
  ctbStopsCache = data.data || data;
  return ctbStopsCache;
}

function matchStop(stop, aliases){
  const tc = norm(stop.name_tc);
  const en = norm(stop.name_en);
  return aliases.some(a => {
    const q = norm(a);
    return tc.includes(q) || en.includes(q);
  });
}

async function findStops(company, aliases){
  const stops = company === "CTB" ? await loadCtbStops() : await loadKmbStops();
  const found = stops.filter(s => matchStop(s, aliases));
  const uniq = new Map();
  for (const s of found) uniq.set(s.stop, s);
  return [...uniq.values()];
}

async function loadKmbETAs(stopId, routes){
  const data = await fetchJSON(`${KMB_API}/stop-eta/${stopId}`);
  const rows = data.data || data;
  return processRows(rows, routes);
}

async function loadCtbETAs(stopId, routes){
  const results = [];
  for (const route of routes) {
    const data = await fetchJSON(`${CTB_API}/eta/CTB/${stopId}/${route}`);
    const rows = data.data || data;
    for (const r of rows) results.push(r);
  }
  return processRows(results, routes, true);
}

function processRows(rows, routes, isCtb=false){
  const wanted = rows.filter(r => routes.includes(String(r.route).trim()) || routes.includes(String(r.route_name || "").trim()));
  const byRoute = new Map();

  for (const r of wanted) {
    const route = String(r.route || r.route_name || "").trim();
    if (!route) continue;
    if (!byRoute.has(route)) byRoute.set(route, []);
    byRoute.get(route).push(r);
  }

  for (const [route, arr] of byRoute.entries()) {
    const seen = new Set();
    const deduped = [];
    arr.sort((a,b) => new Date(aeta(a)) - new Date(aeta(b)));
    for (const r of arr) {
      const key = aeta(r) || "";
      if (seen.has(key)) continue;
      seen.add(key);
      deduped.push(r);
    }
    byRoute.set(route, deduped.slice(0,2));
  }

  return byRoute;

  function aeta(r){
    return r.eta || r.arrivalTime || r.data_time || r.express_eta || r.estimatedArrivalTime;
  }
}

function etaText(r){
  const t = r.eta || r.arrivalTime || r.data_time || r.express_eta || r.estimatedArrivalTime;
  return fmtEta(t);
}

async function renderGroup(containerId, group){
  const el = document.getElementById(containerId);
  el.innerHTML = "";

  for (const item of group) {
    const stops = await findStops(item.company, item.aliases);

    for (const stop of stops) {
      let byRoute = new Map();
      try{
        byRoute = item.company === "CTB"
          ? await loadCtbETAs(stop.stop, item.routes)
          : await loadKmbETAs(stop.stop, item.routes);
      }catch(e){
        continue;
      }

      const routeEntries = [...byRoute.entries()].filter(([_, arr]) => arr.length > 0);
      if (!routeEntries.length) continue;

      const card = document.createElement("div");
      card.className = "stopcard";

      let html = `
        <div class="stopname">
          <span>${item.name}</span>
          <span class="small">${stop.name_tc || stop.name_en || stop.stop}</span>
        </div>
      `;

      routeEntries.sort((a,b) => item.routes.indexOf(a[0]) - item.routes.indexOf(b[0]));

      for (const [route, arr] of routeEntries) {
        const etas = arr.map(etaText).join(", ");
        html += `
          <div class="route">
            <div class="badge ${item.company === "CTB" ? "ctb" : "kmb"}">${route}</div>
            <div class="etas">${etas}</div>
          </div>
        `;
      }

      card.innerHTML = html;
      el.appendChild(card);
    }
  }

  if (!el.children.length) {
    el.innerHTML = `<div class="small">暫時無符合路線 ETA</div>`;
  }
}

async function refreshAll(){
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  document.getElementById("status").textContent = "更新中...";
  try{
    await renderGroup("workList", config.work);
    await renderGroup("homeList", config.home);
    document.getElementById("status").textContent = `已更新：${new Date().toLocaleString("zh-HK")}`;
  }catch(e){
    document.getElementById("status").textContent = "更新失敗，請再試";
  }finally{
    btn.disabled = false;
  }
}

document.getElementById("refreshBtn").addEventListener("click", refreshAll);
refreshAll();
setInterval(refreshAll, 30000);
</script>
</body>
</html>
