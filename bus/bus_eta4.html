<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KMB ETA Dashboard</title>
  <style>
    :root{
      --bg:#08111f;
      --card:#101a33;
      --line:#253457;
      --text:#eef4ff;
      --muted:#93a2c7;
      --good:#36d399;
      --accent:#6ea8fe;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans HK","PingFang HK","Helvetica Neue",Arial,sans-serif;
      background:radial-gradient(circle at top, #17274b, var(--bg));
      color:var(--text);
    }
    .app{
      max-width:1100px;
      margin:0 auto;
      padding:12px;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      background:rgba(16,26,51,.92);
      border:1px solid var(--line);
      border-radius:18px;
      backdrop-filter:blur(10px);
    }
    .title{font-size:18px;font-weight:800;line-height:1.2}
    .meta{font-size:12px;color:var(--muted);margin-top:4px}
    button{
      appearance:none;
      border:0;
      background:linear-gradient(135deg,#4f8cff,#6ea8fe);
      color:#fff;
      font-weight:800;
      padding:12px 16px;
      border-radius:14px;
      font-size:15px;
      box-shadow:0 8px 20px rgba(78,124,255,.25);
    }
    button:disabled{opacity:.6}
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      flex:1;
      min-height:0;
    }
    .panel{
      background:rgba(16,26,51,.92);
      border:1px solid var(--line);
      border-radius:18px;
      padding:12px;
      display:flex;
      flex-direction:column;
      min-height:0;
    }
    .panel h2{margin:0 0 6px;font-size:18px}
    .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
    .group{
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow:auto;
      min-height:0;
    }
    .stopcard{
      background:rgba(22,33,63,.92);
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px;
    }
    .stopname{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center;
      font-weight:800;
      margin-bottom:8px;
    }
    .small{color:var(--muted);font-size:12px}
    .route{
      display:grid;
      grid-template-columns:56px 1fr;
      gap:8px;
      align-items:center;
      padding:8px 10px;
      border-radius:12px;
      background:#0f172d;
      border:1px solid #223055;
      font-size:14px;
      margin-bottom:6px;
    }
    .badge{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      width:56px;
      padding:5px 0;
      border-radius:999px;
      background:#21315a;
      color:#dce8ff;
      font-weight:800;
    }
    .etas{color:var(--good);font-weight:800}
    .foot{
      color:var(--muted);
      font-size:11px;
      text-align:center;
      padding-bottom:2px;
    }
    @media (max-width:820px){
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div>
        <div class="title">KMB 實時 ETA</div>
        <div class="meta" id="status">載入中...</div>
      </div>
      <button id="refreshBtn">Refresh</button>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>返工（往港島）</h2>
        <div class="sub">土瓜灣街市 · 107 / 108</div>
        <div class="group" id="workList"></div>
      </section>

      <section class="panel">
        <h2>放工（往九龍）</h2>
        <div class="sub">景隆街 · 106；怡和街 · 108 / 116</div>
        <div class="group" id="homeList"></div>
      </section>
    </div>

    <div class="foot">資料來源：KMB open data stop / stop-eta</div>
  </div>

<script>
const API = "https://data.etabus.gov.hk/v1/transport/kmb";

const config = {
  work: [
    { name: "土瓜灣街市", aliases: ["土瓜灣街市", "To Kwa Wan Market"], routes: ["107", "108"] }
  ],
  home: [
    { name: "景隆街", aliases: ["景隆街", "Cannon Street"], routes: ["106"] },
    { name: "怡和街", aliases: ["怡和街", "Jardine's Crescent"], routes: ["108", "116"] }
  ]
};

let stopCache = null;

async function fetchJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function norm(s){
  return String(s || "").trim().toLowerCase();
}

function fmtEta(eta){
  if(!eta) return "—";
  const t = new Date(eta);
  if(isNaN(t)) return eta;
  const diff = Math.round((t - new Date()) / 60000);
  if(diff <= 0) return "到站";
  if(diff === 1) return "1 分鐘";
  return `${diff} 分鐘`;
}

async function loadStops(){
  if (stopCache) return stopCache;
  const data = await fetchJSON(`${API}/stop`);
  stopCache = data.data || data;
  return stopCache;
}

function matchStop(stop, aliases){
  const tc = norm(stop.name_tc);
  const en = norm(stop.name_en);
  return aliases.some(a => {
    const q = norm(a);
    return tc.includes(q) || en.includes(q);
  });
}

async function findStopsByAliases(aliases){
  const stops = await loadStops();
  const found = stops.filter(s => matchStop(s, aliases));
  const uniq = new Map();
  for (const s of found) uniq.set(s.stop, s);
  return [...uniq.values()];
}

async function loadETAs(stopId, routes){
  const data = await fetchJSON(`${API}/stop-eta/${stopId}`);
  const rows = data.data || data;
  const wanted = rows.filter(r => routes.includes(String(r.route).trim()));

  const byRoute = new Map();
  for (const r of wanted) {
    const route = String(r.route).trim();
    if (!byRoute.has(route)) byRoute.set(route, []);
    byRoute.get(route).push(r);
  }

  for (const [route, arr] of byRoute.entries()) {
    const seen = new Set();
    const deduped = [];
    arr.sort((a,b) => new Date(a.eta) - new Date(b.eta));
    for (const r of arr) {
      const key = r.eta || "";
      if (seen.has(key)) continue;
      seen.add(key);
      deduped.push(r);
    }
    byRoute.set(route, deduped.slice(0, 2));
  }

  return byRoute;
}

async function renderGroup(containerId, group){
  const el = document.getElementById(containerId);
  el.innerHTML = "";

  for (const item of group) {
    const stops = await findStopsByAliases(item.aliases);

    const renderStops = [];
    for (const stop of stops) {
      const byRoute = await loadETAs(stop.stop, item.routes);
      const hasAny = [...byRoute.values()].some(arr => arr.length > 0);
      if (hasAny) renderStops.push({ stop, byRoute });
    }

    if (!renderStops.length) continue;

    for (const { stop, byRoute } of renderStops) {
      const card = document.createElement("div");
      card.className = "stopcard";

      let html = `
        <div class="stopname">
          <span>${item.name}</span>
          <span class="small">${stop.name_tc || stop.name_en || stop.stop}</span>
        </div>
      `;

      const routesSorted = [...byRoute.keys()].sort((a,b) => item.routes.indexOf(a) - item.routes.indexOf(b));

      for (const route of routesSorted) {
        const arr = byRoute.get(route) || [];
        if (!arr.length) continue;
        const etas = arr.map(r => fmtEta(r.eta)).join(", ");
        html += `
          <div class="route">
            <div class="badge">${route}</div>
            <div class="etas">${etas}</div>
          </div>
        `;
      }

      card.innerHTML = html;
      el.appendChild(card);
    }
  }

  if (!el.children.length) {
    el.innerHTML = `<div class="small">暫時無符合路線 ETA</div>`;
  }
}

async function refreshAll(){
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  document.getElementById("status").textContent = "更新中...";
  try{
    await renderGroup("workList", config.work);
    await renderGroup("homeList", config.home);
    document.getElementById("status").textContent = `已更新：${new Date().toLocaleString("zh-HK")}`;
  }catch(e){
    document.getElementById("status").textContent = "更新失敗，請再試";
  }finally{
    btn.disabled = false;
  }
}

document.getElementById("refreshBtn").addEventListener("click", refreshAll);
refreshAll();
setInterval(refreshAll, 30000);
</script>
</body>
</html>
